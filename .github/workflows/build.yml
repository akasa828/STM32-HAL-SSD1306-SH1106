name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debug-128x64-ssd1306, type: Debug, width: 128, height: 64, controller: 0 }
          - { name: release-128x64-ssd1306, type: Release, width: 128, height: 64, controller: 0 }
          - { name: debug-128x32-ssd1306, type: Debug, width: 128, height: 32, controller: 0 }
          - { name: debug-96x64-ssd1306, type: Debug, width: 96, height: 64, controller: 0 }
          - { name: debug-128x128-ssd1306, type: Debug, width: 128, height: 128, controller: 0 }
          - { name: debug-128x64-sh1106, type: Debug, width: 128, height: 64, controller: 1 }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi
      - run: >-
          cmake -S . -B build/${{ matrix.name }} -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DOLED_WIDTH_OVERRIDE=${{ matrix.width }}
          -DOLED_HEIGHT_OVERRIDE=${{ matrix.height }}
          -DOLED_CONTROLLER_OVERRIDE=${{ matrix.controller }}
      - run: cmake --build build/${{ matrix.name }} --parallel
      - run: >-
          ! grep -R -n -E '^#include.*(main\.h|i2c\.h|system_diag\.h)|hi2c1|MX_I2C1_Init|HAL_I2C_'
          Core/OLED/oled.cpp Core/OLED/oled.hpp Core/OLED/oled_port.h
