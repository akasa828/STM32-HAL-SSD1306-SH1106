name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cppcheck
      - name: Configure host tests
        run: cmake -S tests -B build/host -G Ninja
      - name: Build host tests
        run: cmake --build build/host
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure
      - name: Run static analysis
        run: >-
          cppcheck --enable=warning,performance,portability --std=c++17
          --error-exitcode=1 --suppress=missingIncludeSystem
          -DOLED_WIDTH=16 -DOLED_HEIGHT=16 -DOLED_ENABLE_WAVE=1
          -I Core/OLED -I Core/Port Core/OLED/oled.cpp
          Core/Port/oled_stm32_hal.c

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        display:
          - { name: ssd1306-128x32, controller: 0, width: 128, height: 32, offset: 0 }
          - { name: ssd1306-128x64, controller: 0, width: 128, height: 64, offset: 0 }
          - { name: ssd1306-96x64, controller: 0, width: 96, height: 64, offset: 0 }
          - { name: ssd1306-128x128, controller: 0, width: 128, height: 128, offset: 0 }
          - { name: sh1106-128x64, controller: 1, width: 128, height: 64, offset: 2 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi ninja-build
      - name: Configure firmware
        run: >-
          cmake --preset ${{ matrix.build_type }}
          -B build/${{ matrix.display.name }}-${{ matrix.build_type }}
          -DOLED_CONTROLLER_OVERRIDE=${{ matrix.display.controller }}
          -DOLED_WIDTH_OVERRIDE=${{ matrix.display.width }}
          -DOLED_HEIGHT_OVERRIDE=${{ matrix.display.height }}
          -DOLED_COLUMN_OFFSET_OVERRIDE=${{ matrix.display.offset }}
      - name: Build firmware
        run: cmake --build build/${{ matrix.display.name }}-${{ matrix.build_type }}
